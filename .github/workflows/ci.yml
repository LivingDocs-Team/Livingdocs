ai-service-integration:
    name: AI Service Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies (AI service + analyzer)
        run: python -m pip install -r ai-service/requirements.txt javalang

      - name: Start analyzer service (LD-328) on port 8000
        working-directory: ai-service/tests/integration/fixtures
        run: nohup python -m uvicorn --app-dir "$GITHUB_WORKSPACE" app.main:app --port 8000 > "$RUNNER_TEMP/analyzer.log" 2>&1 &

      - name: Start AI service on port 8001
        working-directory: ai-service
        run: nohup python -m uvicorn main:app --port 8001 > "$RUNNER_TEMP/ai-service.log" 2>&1 &

      - name: Wait for both services
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health && curl -fsS -o /dev/null http://localhost:8000/openapi.json; then
              exit 0
            fi
            sleep 1
          done
          echo "Services did not start"; exit 1

      - name: Run integration tests across services
        working-directory: ai-service
        env:
          ANALYZER_URL: "http://localhost:8000"
          AI_SERVICE_URL: "http://localhost:8001"
        run: python -m pytest tests/test_ai_service.py
