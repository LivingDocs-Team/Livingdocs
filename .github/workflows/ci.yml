
name: LivingDocs CI

on:
  push:
    branches:
      - main
      - "LD-*"
  pull_request:
    branches:
      - main

jobs:
  repository-check:
    name: Repository Structure Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify README exists
        run: test -f README.md

      - name: Report repository status
        run: echo "LivingDocs CI ran successfully."