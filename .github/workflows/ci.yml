
name: LivingDocs CI

on:
  push:
    branches:
      - main
      - "LD-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livingdocs-ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cnpm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cnpm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify repository files
        run: |
          test -s README.md
          test -s backend/pom.xml
          test -s .github/workflows/ci.yml

      - name: Make Maven Wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/cnpm
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

      - name: Report CI result
        if: success()
        run: echo "LivingDocs backend build and tests passed."

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ai-service-test:
    name: AI Service Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: python -m pip install -r requirements.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest -q

  docker-build:
    name: Docker Compose Build and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOKEN_ENCRYPTION_KEY: ci-placeholder-not-a-secret

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build

  ai-service-integration:
    name: AI Service Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies (AI service + analyzer)
        run: python -m pip install -r ai-service/requirements.txt javalang

      - name: Start analyzer service (LD-328) on port 8000
        # Runs from fixtures so the analyzer reads repository-like fixture files.
        working-directory: ai-service/tests/integration/fixtures
        run: nohup python -m uvicorn --app-dir "$GITHUB_WORKSPACE" app.main:app --port 8000 > "$RUNNER_TEMP/analyzer.log" 2>&1 &

      - name: Start AI service on port 8001
        working-directory: ai-service
        run: nohup python -m uvicorn main:app --port 8001 > "$RUNNER_TEMP/ai-service.log" 2>&1 &

      - name: Wait for both services
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health && curl -fsS -o /dev/null http://localhost:8000/openapi.json; then
              exit 0
            fi
            sleep 1
          done
          echo "Services did not start"; exit 1

      - name: Run integration tests across services
        working-directory: ai-service
        env:
          ANALYZER_URL: http://localhost:8000
          AI_SERVICE_URL: http://localhost:8001
        run: python -m pytest -m live -v tests/integration

      - name: Show service logs
        if: failure()
        run: |
          echo "--- analyzer ---"; cat "$RUNNER_TEMP/analyzer.log" || true
          echo "--- ai-service ---"; cat "$RUNNER_TEMP/ai-service.log" || true
      - name: Start analyzer service (LD-328) on port 8000
        working-directory: ai-service/tests/integration/fixtures
        run: |
          nohup python -m uvicorn --app-dir "$GITHUB_WORKSPACE" app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/analyzer.log" 2>&1 &
          sleep 3

      - name: Start AI service on port 8001
        working-directory: ai-service
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/ai-service.log" 2>&1 &
          sleep 3

      - name: Wait for both services
        run: |
          curl --retry 30 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8001/health
          curl --retry 30 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8000/openapi.json
      - name: Show service logs
        if: failure()
        run: |
          echo "--- analyzer ---"; cat "$RUNNER_TEMP/analyzer.log" || true
          echo "--- ai-service ---"; cat "$RUNNER_TEMP/ai-service.log" || true