name: LivingDocs CI

on:
  push:
    branches:
      - main
      - "LD-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "livingdocs-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cnpm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d cnpm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify repository files
        run: |
          test -s README.md
          test -s backend/pom.xml
          test -s .github/workflows/ci.yml

      - name: Make Maven Wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test backend
        env:
          DB_URL: "jdbc:postgresql://localhost:5432/cnpm"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

      - name: Report CI result
        if: success()
        run: echo "LivingDocs backend build and tests passed."

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-e2e-test:
    name: Frontend E2E Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FRONTEND_URL: http://localhost:3000
      FRONTEND_E2E_REQUIRED: "true"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve built frontend on port 3000
        working-directory: frontend
        run: nohup npx vite preview --port 3000 --strictPort --host 0.0.0.0 > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install "pytest==9.1.1" "pytest-html==4.2.0" "pytest-playwright==0.10.0" "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1 || curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Frontend server is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not start"; cat "$RUNNER_TEMP/frontend.log"; exit 1

      - name: Run documentation preview, editing (LD-105) and template (LD-96) UI tests
        run: python -m pytest -v tests/test_documentation_preview_editing.py tests/test_frontend_templates.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-test-report
          path: |
            test-report.html
            test-results.xml
          if-no-files-found: ignore

  github-integration-test:
    name: GitHub Integration Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/github-integration-service/pom.xml

      - name: Build and test (H2 database, mocked GitHub)
        run: mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml verify

      - name: Live test against real GitHub API
        env:
          GITHUB_LIVE_TEST: "true"
          GITHUB_LIVE_REPO: "${{ github.repository }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: >-
          mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml test
          -Dtest=GitHubRepositoryFetcherLiveTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-integration-test-reports
          path: services/github-integration-service/target/surefire-reports/
          if-no-files-found: ignore

ai-service-integration:
    name: AI Service Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies (AI service + analyzer)
        run: python -m pip install -r ai-service/requirements.txt javalang uvicorn httpx

      - name: Start analyzer service (LD-328) on port 8000
        working-directory: ai-service/tests/integration/fixtures
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: nohup python -m uvicorn --app-dir "$GITHUB_WORKSPACE" app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/analyzer.log" 2>&1 &

      - name: Start AI service on port 8001
        working-directory: ai-service
        env:
          PYTHONPATH: "${{ github.workspace }}/ai-service"
          ANTHROPIC_API_KEY: "mock_ci_key_for_integration_testing"
        run: nohup python -m uvicorn main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/ai-service.log" 2>&1 &

      - name: Wait for both services
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health > /dev/null 2>&1 && curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null 2>&1; then
              echo "Both background services started successfully!"
              exit 0
            fi
            sleep 1
          done
          echo "Services did not start"; cat "$RUNNER_TEMP/analyzer.log"; cat "$RUNNER_TEMP/ai-service.log"; exit 1

      - name: Run integration tests across services
        working-directory: ai-service
        env:
          ANALYZER_URL: "http://127.0.0.1:8000"
          AI_SERVICE_URL: "http://127.0.0.1:8001"
          PYTHONPATH: "${{ github.workspace }}/ai-service"
          ANTHROPIC_API_KEY: "mock_ci_key_for_integration_testing"
        run: python -m pytest -v tests/integration -m "not live"

      - name: Show service logs
        if: failure()
        run: |
          echo "--- analyzer ---"; cat "$RUNNER_TEMP/analyzer.log" || true
          echo "--- ai-service ---"; cat "$RUNNER_TEMP/ai-service.log" || true
