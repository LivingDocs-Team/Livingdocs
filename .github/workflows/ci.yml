name: LivingDocs CI

on:
  push:
    branches:
      - main
      - "LD-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "livingdocs-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  ai-service-integration:
    name: AI Service Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r ai-service/requirements.txt uvicorn httpx fastapi pytest

      - name: Start service and strict readiness check
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai-service"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/app.log" 2>&1 &
          
          # Readiness Check loop nghiêm ngặt
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null 2>&1; then
              echo "FastAPI background service is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Service failed to respond within 30s timeout!"
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Run Pytest suite
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai-service"
        run: python -m pytest -v tests/test_evidence_submission.py

  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOKEN_ENCRYPTION_KEY: "ci-validation-placeholder-only"
      GITHUB_INTEGRATION_INTERNAL_SECRET: "ci-validation-placeholder-only"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config --quiet
