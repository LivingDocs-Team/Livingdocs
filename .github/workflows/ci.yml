name: LivingDocs CI

on:
  push:
    branches:
      - main
      - "LD-*"
  pull_request:
    branches:
      - main
      - "codex/p0-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "livingdocs-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cnpm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d cnpm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify repository files
        run: |
          test -s README.md
          test -s backend/pom.xml
          test -s .github/workflows/ci.yml

      - name: Make Maven Wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test backend
        env:
          DB_URL: "jdbc:postgresql://localhost:5432/cnpm"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

      - name: Report CI result
        if: success()
        run: echo "LivingDocs backend build and tests passed."

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests (RBAC permissions, screen flows, route guard)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-e2e-test:
    name: Frontend E2E Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FRONTEND_URL: http://localhost:3000
      FRONTEND_E2E_REQUIRED: "true"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve built frontend on port 3000
        working-directory: frontend
        run: nohup npx vite preview --port 3000 --strictPort --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install "pytest==9.1.1" "pytest-html==4.2.0" "pytest-playwright==0.10.0" "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          echo "Frontend did not start"; cat "$RUNNER_TEMP/frontend.log"; exit 1

      - name: Run documentation, Manager approval and RBAC UI tests
        run: python -m pytest -v tests/test_documentation_preview_editing.py tests/test_frontend_templates.py tests/test_repository_activity.py tests/test_profile_preferences.py tests/test_rbac_screen_flow.py tests/test_frontend_admin.py tests/test_manager_approval.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-test-report
          path: |
            test-report.html
            test-results.xml
          if-no-files-found: ignore

  github-integration-test:
    name: GitHub Integration Service Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # PostgreSQL thật cho các test Documentation Collections (cần khóa hàng FOR UPDATE, H2 không đủ).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: collections_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d collections_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # PostgreSQL cho kiểm tra migration Flyway và API quan hệ tài liệu–code (LD-405).
      postgres-relationships:
        image: postgres:16
        env:
          POSTGRES_DB: github_integration
          POSTGRES_USER: livingdocs
          POSTGRES_PASSWORD: livingdocs
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U livingdocs -d github_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/github-integration-service/pom.xml

      - name: Build and test (H2 database, mocked GitHub)
        run: mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml verify

      - name: Verify webhook secret, signature and duplicate-delivery handling (LD-275)
        run: >-
          mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml test
          -Dtest=WebhookSignatureVerifierTest,GitHubWebhookControllerTest,GitHubWebhookIngestionTest
      - name: Documentation Collections tests (PostgreSQL)
        env:
          COLLECTIONS_TEST_DB_URL: "jdbc:postgresql://localhost:5432/collections_test"
          COLLECTIONS_TEST_DB_USER: "postgres"
          COLLECTIONS_TEST_DB_PASSWORD: "postgres"
        run: >-
          mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml test
          -Dtest='DocumentationCollections*PostgresTest'

      # Maven báo thành công cả khi test bị bỏ qua, nên kiểm tra báo cáo để chắc test đã chạy trên PostgreSQL.
      - name: Verify Documentation Collections tests ran on PostgreSQL
        run: python3 .github/scripts/verify_collections_postgres_tests.py

      - name: Upload Documentation Collections PostgreSQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-collections-postgres-reports
          path: services/github-integration-service/target/surefire-reports/*DocumentationCollections*PostgresTest*
          if-no-files-found: error

      - name: Verify Flyway V1-V5 migrations and relationship API on PostgreSQL
        env:
          DB_URL: "jdbc:postgresql://localhost:5433/github_integration"
          DB_USERNAME: "livingdocs"
          DB_PASSWORD: "livingdocs"
          TOKEN_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          GITHUB_INTEGRATION_INTERNAL_SECRET: "ci-postgres-verification-secret"
        run: >-
          mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml test
          -Dtest=DocumentationCodeRelationshipApiTest
          -Dspring.datasource.url="$DB_URL"
          -Dspring.datasource.username="$DB_USERNAME"
          -Dspring.datasource.password="$DB_PASSWORD"
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.jpa.hibernate.ddl-auto=validate

      - name: Live test against real GitHub API
        env:
          GITHUB_LIVE_TEST: "true"
          GITHUB_LIVE_REPO: "${{ github.repository }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: >-
          mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml test
          -Dtest=GitHubRepositoryFetcherLiveTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Revision workflow through FastAPI and PostgreSQL
        run: docker compose -f tests/revision-e2e/compose.yaml up --build --abort-on-container-exit --exit-code-from test

      - name: Stop revision workflow fixtures
        if: always()
        run: docker compose -f tests/revision-e2e/compose.yaml down --volumes

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-integration-test-reports
          path: services/github-integration-service/target/surefire-reports/
          if-no-files-found: ignore

  ai-service-test:
    name: AI Service Build and Test
    # Pinned: ubuntu-latest is Ubuntu 26.04, which Playwright 1.56 cannot install Chromium on.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: python -m pip install -r requirements.txt

      - name: Install Playwright
        run: |
          python -m pip install "pytest-playwright==0.10.0" "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest -q

  ai-service-integration:
    name: AI Service Integration Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies (AI service + analyzer)
        run: python -m pip install -r ai-service/requirements.txt -r code-analyzer/requirements.txt

      - name: Install Playwright
        run: |
          python -m pip install "pytest-playwright==0.10.0" "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      - name: Analyzer unit tests (LD-328)
        run: python -m pytest -q -o addopts="" tests/test_analysis.py tests/test_evidence_submission.py
        
      - name: Start analyzer service (LD-328) on port 8000
        # runs from the fixtures folder so the analyzer reads shop/*.py like files of a repository
        working-directory: ai-service/tests/integration/fixtures
        run: nohup python -m uvicorn --app-dir "$GITHUB_WORKSPACE" app.main:app --port 8000 > "$RUNNER_TEMP/analyzer.log" 2>&1 &

      - name: Start AI service on port 8001
        working-directory: ai-service
        run: nohup python -m uvicorn main:app --port 8001 > "$RUNNER_TEMP/ai-service.log" 2>&1 &

      - name: Wait for both services
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health && curl -fsS -o /dev/null http://localhost:8000/openapi.json; then
              exit 0
            fi
            sleep 1
          done
          echo "Services did not start"; exit 1

      - name: Run integration tests across services
        working-directory: ai-service
        env:
          ANALYZER_URL: "http://localhost:8000"
          AI_SERVICE_URL: "http://localhost:8001"
        run: python -m pytest -m live -v tests/integration

      - name: Show service logs
        if: failure()
        run: |
          echo "--- analyzer ---"; cat "$RUNNER_TEMP/analyzer.log" || true
          echo "--- ai-service ---"; cat "$RUNNER_TEMP/ai-service.log" || true

  docker-compose-validation:
    name: Docker Compose Validation
    # Pinned like the other Docker/Playwright jobs: ubuntu-latest is Ubuntu 26.04, where the image builds
    # could not download the Spring Boot parent POMs from Maven Central.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOKEN_ENCRYPTION_KEY: "ci-validation-placeholder-only"
      GITHUB_INTEGRATION_INTERNAL_SECRET: "ci-validation-placeholder-only"
      # compose.yaml requires the sign-in OAuth App credentials (no default), like the two variables above
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID: "ci-validation-placeholder-only"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: "ci-validation-placeholder-only"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Verify the GitHub webhook secret is passed to the github-integration service (LD-275)
        run: |
          docker compose -f compose.yaml config > "$RUNNER_TEMP/compose.rendered.yaml"
          grep -q GITHUB_WEBHOOK_SECRET "$RUNNER_TEMP/compose.rendered.yaml"

      - name: Verify Maven build retry behavior
        run: sh scripts/test-docker-maven-retry.sh

  release-smoke-test:
    name: Release Smoke Test (LD-404)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [docker-compose-validation]
    env:
      TOKEN_ENCRYPTION_KEY: "ci-validation-placeholder-only"
      GITHUB_INTEGRATION_INTERNAL_SECRET: "ci-validation-placeholder-only"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID: "ci-validation-placeholder-only"
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: "ci-validation-placeholder-only"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build application images for all smoke runs
        run: docker --context default compose --env-file /dev/null -f compose.yaml build backend ai-service code-analyzer github-integration frontend

      - name: Make scripts executable
        run: |
          bash -n scripts/verify-compose.sh
          chmod +x scripts/verify-compose.sh

      - name: Verify cleanup after failure and two consecutive runs
        shell: bash
        run: |
          assert_clean() {
            local project resource remaining
            local -a args
            project="$(sed -n 's/^Smoke project: //p' "$1/ld-404-smoke-report.log")"
            [[ "$project" =~ ^livingdocs-smoke-[a-z0-9]+$ ]]
            for resource in container volume network; do
              args=()
              if [[ "$resource" == container ]]; then args+=(--all); fi
              remaining="$(docker --context default "$resource" ls "${args[@]}" -q --filter "label=com.docker.compose.project=$project")"
              [[ -z "$remaining" ]]
            done
          }

          if SMOKE_REPORT_DIR=artifacts/failure VERIFY_TIMEOUT=0 ./scripts/verify-compose.sh --no-build; then
            echo "Expected a failure after application startup" >&2
            exit 1
          fi
          grep -F 'backend-db did not become healthy within 0s' artifacts/failure/ld-404-smoke-report.log
          assert_clean artifacts/failure

          SMOKE_REPORT_DIR=artifacts/first VERIFY_LEGACY_RESTORE=1 ./scripts/verify-compose.sh --no-build
          assert_clean artifacts/first
          SMOKE_REPORT_DIR=artifacts/second ./scripts/verify-compose.sh --no-build
          assert_clean artifacts/second

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ld-404-smoke-artifacts
          path: |
            artifacts/**/ld-404-smoke-report.log
            artifacts/**/smoke-*-result.json
          retention-days: 7
