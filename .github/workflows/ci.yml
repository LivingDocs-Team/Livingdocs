ai-service-integration:
    name: AI Service Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r ai-service/requirements.txt uvicorn httpx fastapi pytest

      - name: Start FastAPI application & Readiness check
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai-service"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/app.log" 2>&1 &
          
          # Readiness Check: Kiểm tra API cổng 8000 đã thực sự sẵn sàng phản hồi chưa
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null 2>&1; then
              echo "App is fully ready and serving traffic!"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: App failed to respond within 30s!"
          cat "$RUNNER_TEMP/app.log"
          exit 1

      - name: Run Full API & Persistence Integration Tests
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai-service"
        run: python -m pytest -v tests/test_evidence_submission.py
