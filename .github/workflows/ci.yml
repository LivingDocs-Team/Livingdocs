name: LivingDocs CI

on:
  push:
    branches: [ main, LD-106, "sprint-*" ]
  pull_request:
    branches: [ main, LD-106 ]

jobs:
  backend-test:
    name: LivingDocs CI / Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pytest pydantic

      - name: Run Backend Unit Tests
        run: |
          pytest tests/ -m "not live"

  ai-service-test:
    name: LivingDocs CI / AI Service Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pytest pydantic

      - name: Run AI Service Unit Tests
        run: |
          pytest tests/ -m "not live"

  integration-test:
    name: LivingDocs CI / AI Service Integration Test
    runs-on: ubuntu-latest
    needs: [backend-test, ai-service-test]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pytest pydantic

      - name: Start Backend Service on port 8000
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 2

      - name: Start AI Service Mock on port 8001
        run: |
          python ai_service_mock.py &
          sleep 2

      - name: Wait for both services
        run: |
          python -c "
          import httpx, time
          for i in range(15):
              try:
                  r1 = httpx.get('http://localhost:8000/health')
                  r2 = httpx.get('http://localhost:8001/health')
                  if r1.status_code == 200 and r2.status_code == 200:
                      print('Both services are UP!')
                      break
              except Exception:
                  pass
              time.sleep(1)
          "

      - name: Run integration tests across services
        env:
          ANALYZER: "http://localhost:8000"
          AI: "http://localhost:8001"
          AI_SERVICE_API_KEY: "mock-key-for-ci-integration"
        run: |
          python -m pytest -m live -v tests/integration
