name: LivingDocs CI

on:
  push:
    branches:
      - main
      - "LD-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "livingdocs-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cnpm
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d cnpm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify repository files
        run: |
          test -s README.md
          test -s backend/pom.xml
          test -s .github/workflows/ci.yml

      - name: Make Maven Wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test backend
        env:
          DB_URL: "jdbc:postgresql://localhost:5432/cnpm"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "postgres"
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

      - name: Report CI result
        if: success()
        run: echo "LivingDocs backend build and tests passed."

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-e2e-test:
    name: Frontend E2E Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FRONTEND_URL: http://localhost:3000
      FRONTEND_E2E_REQUIRED: "true"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve built frontend on port 3000
        working-directory: frontend
        run: nohup npx vite preview --port 3000 --strictPort --host 0.0.0.0 > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install "pytest==9.1.1" "pytest-html==4.2.0" "pytest-playwright==0.10.0" "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1 || curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Frontend server is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not start"; cat "$RUNNER_TEMP/frontend.log"; exit 1

      - name: Run documentation preview, editing (LD-105) and template (LD-96) UI tests
        run: python -m pytest -v tests/test_documentation_preview_editing.py tests/test_frontend_templates.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-test-report
          path: |
            test-report.html
            test-results.xml
          if-no-files-found: ignore

  github-integration-test:
    name: GitHub Integration Service Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/github-integration-service/pom.xml

      - name: Build and test (H2 database, mocked GitHub)
        run: mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml verify

      - name: Live test against real GitHub API
        env:
          GITHUB_LIVE_TEST: "true"
          GITHUB_LIVE_REPO: "${{ github.repository }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: >-
          mvn --batch-mode --no-transfer-progress -f services/github-integration-service/pom.xml test
          -Dtest=GitHubRepositoryFetcherLiveTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-integration-test-reports
          path: services/github-integration-service/target/surefire-reports/
          if-no-files-found: ignore

  ai-service-test:
    name: AI Service Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: python -m pip install -r requirements.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest -q

  ai-service-integration:
    name: AI Service Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "ai-service/requirements.txt" ]; then python -m pip install -r ai-service/requirements.txt; fi
          python -m pip install uvicorn httpx fastapi pytest pytest-html anthropic javalang

      # In ra file main.py đang được nạp và danh sách route để dễ debug
      - name: Debug which app is loaded
        env:
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          python - <<'EOF'
          import app.main as m
          print("FILE:", m.__file__)
          print("ROUTES:", sorted(m.app.openapi()["paths"].keys()))
          EOF

      # Test LD-106: PYTHONPATH chỉ chứa thư mục gốc để "app" luôn là app/ ở gốc repo
      - name: LD-106 evidence submission tests
        env:
          PYTHONPATH: "${{ github.workspace }}"
          ANTHROPIC_API_KEY: "mock_ci_key_for_integration_testing"
        run: |
          if [ -f "tests/test_evidence_submission.py" ]; then
            python -m pytest -v tests/test_evidence_submission.py tests/test_evidence_workflow.py
          elif [ -f "ai-service/tests/test_evidence_submission.py" ]; then
            python -m pytest -v ai-service/tests/test_evidence_submission.py
          else
            echo "test_evidence_submission.py not found"; exit 1
          fi

      - name: Start background services
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai-service:${{ github.workspace }}/ai-service/app:${{ github.workspace }}/app"
          ANALYZER_URL: "http://127.0.0.1:8000"
          AI_SERVICE_URL: "http://127.0.0.1:8001"
          ANTHROPIC_API_KEY: "mock_ci_key_for_integration_testing"
        run: |
          # 1. Code Analyzer Service (port 8000)
          if [ -d "ai-service/tests/integration/fixtures/app" ]; then
            nohup python -m uvicorn app.main:app --app-dir "$GITHUB_WORKSPACE/ai-service/tests/integration/fixtures" --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/analyzer.log" 2>&1 &
          elif [ -d "app" ]; then
            nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/analyzer.log" 2>&1 &
          fi

          # 2. AI Service (port 8001)
          if [ -f "ai-service/main.py" ]; then
            nohup python -m uvicorn main:app --app-dir "$GITHUB_WORKSPACE/ai-service" --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/ai-service.log" 2>&1 &
          elif [ -f "main.py" ]; then
            nohup python -m uvicorn main:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/ai-service.log" 2>&1 &
          fi

          # 3. Health check: fail thật nếu service không lên
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8001/ > /dev/null || curl -sf http://127.0.0.1:8001/docs > /dev/null; then
              echo "AI Service & Analyzer Service Ready!"
              exit 0
            fi
            sleep 1
          done
          echo "AI Service did not start"; exit 1

      # Kiểm thử tích hợp gốc của repo (Yêu cầu 5 của Lead)
      - name: Repo integration tests
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/ai-service:${{ github.workspace }}/ai-service/app:${{ github.workspace }}/app"
          ANALYZER_URL: "http://127.0.0.1:8000"
          AI_SERVICE_URL: "http://127.0.0.1:8001"
          ANTHROPIC_API_KEY: "mock_ci_key_for_integration_testing"
        run: |
          if [ -d "ai-service/tests/integration" ]; then
            python -m pytest -v ai-service/tests/integration -m "not live"
          elif [ -d "tests/integration" ]; then
            python -m pytest -v tests/integration -m "not live"
          else
            echo "No integration tests directory found"
          fi

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "--- ANALYZER LOG ---"; cat "$RUNNER_TEMP/analyzer.log" || true
          echo "--- AI SERVICE LOG ---"; cat "$RUNNER_TEMP/ai-service.log" || true

  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOKEN_ENCRYPTION_KEY: "ci-validation-placeholder-only"
      GITHUB_INTEGRATION_INTERNAL_SECRET: "ci-validation-placeholder-only"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Build application images
        run: docker compose -f compose.yaml build backend ai-service code-analyzer github-integration frontend
