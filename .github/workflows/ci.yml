name: LivingDocs CI Pipeline

on:
  push:
    branches: [ main, sprint-4/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-ai-service:
    name: Run AI Service Tests & Code Analyzer Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest httpx

      - name: Verify Health Check & Analyze Repo Endpoints
        run: |
          cd ai-service
          pytest tests/test_evidence_submission.py -k "test_health_check" -v

      - name: Run Full Pytest Execution (Evidence & Submission LD-106)
        run: |
          cd ai-service
          pytest tests/ -v --tb=short
