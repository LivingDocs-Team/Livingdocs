name: CI Pipeline

on:
  push:
    branches: [ main, develop, "feature/**", "LD-*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run All Analyzer & AI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f code-analyzer/requirements.txt ]; then pip install -r code-analyzer/requirements.txt; fi
          if [ -f ai-service/requirements.txt ]; then pip install -r ai-service/requirements.txt; fi
          pip install pytest pytest-html javalang uvicorn fastapi pydantic

      - name: Run Tests
        env:
          PYTHONPATH: .
        run: |
          pytest -v
