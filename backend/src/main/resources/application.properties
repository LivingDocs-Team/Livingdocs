
spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cnpm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Backend-to-GitHub Integration BFF
services.github-integration.base-url=${GITHUB_INTEGRATION_BASE_URL:http://localhost:8082}
services.github-integration.internal-secret=${GITHUB_INTEGRATION_INTERNAL_SECRET:}
services.github-integration.connect-timeout=${GITHUB_INTEGRATION_CONNECT_TIMEOUT:5s}
services.github-integration.read-timeout=${GITHUB_INTEGRATION_READ_TIMEOUT:150s}

# Keep false for plain-HTTP local development. Set SESSION_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
