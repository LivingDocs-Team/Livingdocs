
spring.application.name=backend

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cnpm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

# Upgrade the existing PostgreSQL schema before Hibernate initializes it.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-upgrade-postgresql.sql,classpath:db/notification-policies-postgresql.sql
spring.sql.init.separator=^^^ END OF SCRIPT ^^^

# Set a positive number of days to enable expiry of administrative user audit records.
app.admin-user-audit.retention-days=${ADMIN_USER_AUDIT_RETENTION_DAYS:0}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging - default
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID:ci-placeholder-client-id}
spring.security.oauth2.client.registration.github.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET:ci-placeholder-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Backend-to-GitHub Integration BFF
services.github-integration.base-url=${GITHUB_INTEGRATION_BASE_URL:http://localhost:8082}
services.github-integration.internal-secret=${GITHUB_INTEGRATION_INTERNAL_SECRET:}
services.github-integration.connect-timeout=${GITHUB_INTEGRATION_CONNECT_TIMEOUT:5s}
services.github-integration.read-timeout=${GITHUB_INTEGRATION_READ_TIMEOUT:150s}

# Keep false for plain-HTTP local development. Set SESSION_COOKIE_SECURE=true behind HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
server.forward-headers-strategy=framework
