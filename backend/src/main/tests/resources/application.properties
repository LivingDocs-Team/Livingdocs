spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret

app.admin-user-audit.retention-days=0
services.github-integration.base-url=http://localhost:8082
services.github-integration.internal-secret=test-internal-secret
services.github-integration.connect-timeout=5s
services.github-integration.read-timeout=150s