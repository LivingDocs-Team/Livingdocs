spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret

services.github-integration.base-url=${GITHUB_INTEGRATION_BASE_URL:http://localhost:8082}
services.github-integration.internal-secret=${GITHUB_INTEGRATION_INTERNAL_SECRET:}
services.github-integration.connect-timeout=${GITHUB_INTEGRATION_CONNECT_TIMEOUT:5s}
services.github-integration.read-timeout=${GITHUB_INTEGRATION_READ_TIMEOUT:150s}