# Chạy database cho môi trường dev:  docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: livingdocs-github-db
    environment:
      POSTGRES_DB: github_integration
      POSTGRES_USER: livingdocs
      POSTGRES_PASSWORD: livingdocs
    ports:
      - "5433:5432"
    volumes:
      - github-db-data:/var/lib/postgresql/data

volumes:
  github-db-data:

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: livingdocs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: livingdocs_db
    secrets:
      - postgres_user
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  postgres_data: